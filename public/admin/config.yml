backend:
  name: git-gateway
  branch: main # Production branch for CMS updates

# Helps Netlify Identity fallback flows know the canonical site.
site_url: https://yoananincoaching.com
display_url: https://yoananincoaching.com

media_folder: public/images/uploads # Media files will be stored in the repo under public/images/uploads
public_folder: /images/uploads # The src attribute for uploaded media will begin with /images/uploads

collections:
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blog Posts" # Used in the UI
    folder: "src/content/blog" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    summary: "{{title}} | {{date | date('M/D/YYYY h:mm A')}} | {{is_published}}"
    slug: "{{fields.slug}}" # Use explicit slug field so title edits don't rename files
    fields: # The fields for each document, usually in front matter
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'A slug can have no spaces or special characters'] }
      - { label: "Publish Date", name: "date", widget: "datetime", hint: "You can set this for today or a future date. If Publish To Website is ON, the post goes live on or after this date/time." }
      - { label: "Author", name: "author", widget: "string", default: "Yoana Nin" }
      - { label: "Category", name: "category", widget: "select", options: ["Coaching", "Community", "Real Estate", "Personal Growth"], default: "Coaching" }
      - { label: "Publish To Website", name: "is_published", widget: "boolean", default: false, hint: "Turn ON only when this post is approved. If Publish Date is in the future, the post stays hidden until that date/time." }
      - { label: "Tags", name: "tags", widget: "string", required: false, hint: "Use comma-separated tags. Example: ADHD, overwhelm, women entrepreneurs, Raleigh coaching" }
      - { label: "Featured", name: "featured", widget: "boolean", default: true }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false, hint: "Use one main image per post for consistent style." }
      - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false, hint: "Describe the featured image for accessibility and SEO." }
      - { label: "Key Answer (AEO)", name: "key_answer", widget: "text", required: false, hint: "Direct answer snippet. Keep it short (about 1-3 sentences)." }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Meta Description", name: "meta_description", widget: "text", hint: "SEO description for search engines" }
      - label: "FAQ (AEO)"
        name: "faq"
        widget: "list"
        required: false
        hint: "Optional. Add common questions and direct answers."
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Geo Focus", name: "geo_focus", widget: "string", required: false, default: "Raleigh, NC", hint: "Primary local area for this article." }
      - { label: "Add Local Schema", name: "geo_schema", widget: "boolean", default: true, required: false }
      - { label: "Source URL", name: "source_url", widget: "string", required: false, hint: "Optional. Paste the original Instagram/video link here for your records." }
      - label: "Body"
        name: "body"
        widget: "markdown"
        required: true
        modes: ["rich_text", "raw"]
        default_mode: "raw"
        hint: "Required. Use H2/H3 inside body (no H1). Prefer Markdown mode for reliable saves."