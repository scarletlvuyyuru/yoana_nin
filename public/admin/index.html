<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="cms-loading" style="font-family: Arial, sans-serif; padding: 2rem; color: #1f2937;">
      Loading CMS…
    </div>

    <script>
      window.CMS_MANUAL_INIT = true;

      (function loadDecapCMS() {
        var loadingEl = document.getElementById('cms-loading');

        function registerVideoToBlogWidget() {
          if (!window.CMS) {
            return;
          }

          var h =
            (window.React && window.React.createElement) ||
            (window.CMS && window.CMS.h) ||
            null;

          if (!h) {
            throw new Error('Unable to initialize custom widget UI renderer.');
          }

          function getValue(value, key, fallback) {
            if (!value) return fallback;
            if (typeof value.get === 'function') {
              var fromMap = value.get(key);
              return fromMap === undefined ? fallback : fromMap;
            }
            if (value[key] === undefined) return fallback;
            return value[key];
          }

          function toPlainObject(value) {
            if (!value) return {};
            if (typeof value.toJS === 'function') return value.toJS();
            return value;
          }

          var VideoToBlogControl = function (props) {
            var value = props.value || {};
            var loading = !!getValue(value, '_loading', false);
            var error = getValue(value, '_error', '');
            var success = getValue(value, '_success', '');
            var useMock = getValue(value, 'use_mock', true) !== false;
            var generatedTitle = getValue(value, 'title', '');

            function pushPatch(patch) {
              var current = toPlainObject(props.value);
              props.onChange(Object.assign({}, current, patch));
            }

            function toggleMock(event) {
              pushPatch({ use_mock: !!event.target.checked });
            }

            async function handleGenerate() {
              var entry = props.entry;
              var sourceUrl = (entry && entry.getIn(['data', 'source_url'])) || '';
              var sourceType = (entry && entry.getIn(['data', 'source_type'])) || 'other';

              if (!sourceUrl) {
                pushPatch({ _error: 'Please fill Source URL first.', _success: '', _loading: false });
                return;
              }

              pushPatch({ _loading: true, _error: '', _success: '' });

              try {
                var response = await fetch('/.netlify/functions/video-to-blog', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    sourceUrl: sourceUrl,
                    sourceType: sourceType,
                    mock: useMock,
                  }),
                });

                var data = await response.json();
                if (!response.ok || !data.ok) {
                  throw new Error(data.error || 'Generation failed.');
                }

                pushPatch({
                  apply_on_save: true,
                  generated_at: new Date().toISOString(),
                  source_url: sourceUrl,
                  source_type: sourceType,
                  transcript: data.transcript || '',
                  title: data.draft && data.draft.title ? data.draft.title : '',
                  slug: data.draft && data.draft.slug ? data.draft.slug : '',
                  excerpt: data.draft && data.draft.excerpt ? data.draft.excerpt : '',
                  meta_description:
                    data.draft && data.draft.meta_description ? data.draft.meta_description : '',
                  key_answer: data.draft && data.draft.key_answer ? data.draft.key_answer : '',
                  body: data.draft && data.draft.body ? data.draft.body : '',
                  _loading: false,
                  _error: '',
                  _success:
                    'Draft generated. Click Save to apply title, excerpt, meta, transcript, and body.',
                });
              } catch (requestError) {
                pushPatch({
                  _loading: false,
                  _error: requestError.message || 'Generation failed.',
                  _success: '',
                });
              }
            }

            return h(
              'div',
              {
                style: {
                  border: '1px solid #e5e7eb',
                  borderRadius: '8px',
                  padding: '12px',
                  background: '#f9fafb',
                },
              },
              h(
                'p',
                { style: { margin: '0 0 8px', fontSize: '13px', color: '#374151' } },
                'Generate draft from source_url + transcript. Uses transcript messaging only.'
              ),
              h(
                'label',
                { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' } },
                h('input', {
                  type: 'checkbox',
                  checked: useMock,
                  onChange: toggleMock,
                }),
                h('span', { style: { fontSize: '13px' } }, 'Use mock transcript mode (safe testing)')
              ),
              h(
                'button',
                {
                  type: 'button',
                  onClick: handleGenerate,
                  disabled: loading,
                  style: {
                    background: '#111827',
                    color: '#ffffff',
                    border: 'none',
                    borderRadius: '6px',
                    padding: '8px 12px',
                    cursor: loading ? 'not-allowed' : 'pointer',
                  },
                },
                loading ? 'Generating…' : 'Generate Blog Draft'
              ),
              error
                ? h('p', { style: { margin: '10px 0 0', color: '#b91c1c', fontSize: '13px' } }, error)
                : null,
              success
                ? h('p', { style: { margin: '10px 0 0', color: '#065f46', fontSize: '13px' } }, success)
                : null,
              generatedTitle
                ? h(
                    'p',
                    { style: { margin: '10px 0 0', fontSize: '13px', color: '#111827' } },
                    'Generated title: ',
                    h('strong', null, generatedTitle)
                  )
                : null
            );
          };

          window.CMS.registerWidget('video_to_blog', VideoToBlogControl);

          window.CMS.registerEventListener({
            name: 'preSave',
            handler: function (_ref) {
              var entry = _ref.entry;
              var data = entry.get('data');
              if (!data) return entry;

              var aiGeneration = data.get('ai_generation');
              if (!aiGeneration) return entry;

              var applyOnSave = aiGeneration.get('apply_on_save') === true;
              if (!applyOnSave) {
                return entry.set('data', data.delete('ai_generation'));
              }

              var nextData = data
                .set('title', aiGeneration.get('title') || data.get('title'))
                .set('slug', aiGeneration.get('slug') || data.get('slug'))
                .set('excerpt', aiGeneration.get('excerpt') || data.get('excerpt'))
                .set(
                  'meta_description',
                  aiGeneration.get('meta_description') || data.get('meta_description')
                )
                .set('key_answer', aiGeneration.get('key_answer') || data.get('key_answer'))
                .set('body', aiGeneration.get('body') || data.get('body'))
                .set('transcript', aiGeneration.get('transcript') || data.get('transcript'))
                .set('source_url', aiGeneration.get('source_url') || data.get('source_url'))
                .set('source_type', aiGeneration.get('source_type') || data.get('source_type'))
                .set('creation_mode', 'video')
                .set('workflow_stage', 'draft_ready')
                .delete('ai_generation');

              return entry.set('data', nextData);
            },
          });
        }

        function showError() {
          if (loadingEl) {
            loadingEl.innerHTML = 'CMS failed to load. Please refresh the page. If this continues, check Netlify CSP settings for /admin.';
          }
        }

        function attachScript(src, onLoad, onError) {
          var script = document.createElement('script');
          script.src = src;
          script.async = true;
          script.onload = onLoad;
          script.onerror = onError;
          document.body.appendChild(script);
        }

        attachScript(
          'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js',
          function () {
            try {
              registerVideoToBlogWidget();
              window.CMS.init();
              if (loadingEl) loadingEl.remove();
            } catch (error) {
              console.error(error);
              showError();
            }
          },
          function () {
            attachScript(
              'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js',
              function () {
                try {
                  registerVideoToBlogWidget();
                  window.CMS.init();
                  if (loadingEl) loadingEl.remove();
                } catch (error) {
                  console.error(error);
                  showError();
                }
              },
              showError
            );
          }
        );
      })();
    </script>
  </body>
</html>
