<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="cms-loading" style="font-family: Arial, sans-serif; padding: 2rem; color: #1f2937;">
      Loading CMS…
    </div>

    <script>
      (function setupBlogPrefillBridge() {
        var PREFILL_KEY = 'yoana_blog_prefill';
        var PREFILL_PENDING_KEY = 'yoana_blog_prefill_pending';
        var PANEL_ID = 'yoana-prefill-panel';
        var QUICK_ACTION_ID = 'yoana-ai-blog-quick-action';
        var COLLECTION_STYLE_ID = 'yoana-blog-collection-style';

        function readPrefill() {
          try {
            var raw = localStorage.getItem(PREFILL_KEY);
            if (!raw) return null;
            return JSON.parse(raw);
          } catch (error) {
            return null;
          }
        }

        function isBlogNewRoute() {
          return !!window.location.hash && window.location.hash.indexOf('/collections/blog/new') !== -1;
        }

        function isBlogCollectionRoute() {
          var hash = window.location.hash || '';
          return hash.indexOf('/collections/blog') !== -1
            && hash.indexOf('/collections/blog/new') === -1
            && hash.indexOf('/collections/blog/entries/') === -1;
        }

        function isBlogEditorRoute() {
          var hash = window.location.hash || '';
          return hash.indexOf('/collections/blog/new') !== -1
            || hash.indexOf('/collections/blog/entries/') !== -1;
        }

        function findNewBlogPostButton() {
          var controls = Array.prototype.slice.call(document.querySelectorAll('a, button, [role="button"]'));
          return controls.find(function (el) {
            var text = (el.textContent || '').toLowerCase().replace(/\s+/g, ' ').trim();
            var href = (el.getAttribute && el.getAttribute('href')) || '';
            return text.indexOf('new blog post') !== -1
              || text.indexOf('new blog posts') !== -1
              || href.indexOf('/collections/blog/new') !== -1;
          }) || null;
        }

        function ensureBlogCollectionStyles() {
          var existing = document.getElementById(COLLECTION_STYLE_ID);
          if (existing) return;

          var style = document.createElement('style');
          style.id = COLLECTION_STYLE_ID;
          style.textContent = [
            'a[href*="/collections/blog/entries/"] { width: 100% !important; max-width: none !important; }',
            'a[href*="/collections/blog/entries/"] > div { width: 100% !important; max-width: none !important; }',
            'a[href*="/collections/blog/entries/"] strong,',
            'a[href*="/collections/blog/entries/"] span,',
            'a[href*="/collections/blog/entries/"] div { white-space: normal !important; overflow: visible !important; text-overflow: unset !important; }'
          ].join('\n');
          document.head.appendChild(style);
        }

        function parseSummaryDate(summaryText) {
          var match = summaryText.match(/\|\s*(\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}\s+[AP]M)\b/i);
          if (!match) return NaN;

          var parsed = Date.parse(match[1]);
          return Number.isFinite(parsed) ? parsed : NaN;
        }

        function parsePrimarySummary(rawText) {
          var compact = (rawText || '').replace(/\s+/g, ' ').trim();
          var summaryMatch = compact.match(/^(.*?)\s*\|\s*(\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}\s+[AP]M)\b/i);
          if (!summaryMatch) return null;

          var title = (summaryMatch[1] || '').trim();
          var dateText = (summaryMatch[2] || '').trim();
          if (!title || !dateText) return null;

          return {
            title: title,
            dateText: dateText,
            compact: compact,
          };
        }

        function rewriteBlogEntryStatuses() {
          var entryLinks = document.querySelectorAll('a[href*="/collections/blog/entries/"]');
          Array.prototype.forEach.call(entryLinks, function (link) {
            var parsed = parsePrimarySummary(link.textContent || '');
            if (!parsed) return;

            var raw = parsed.compact;
            var boolMatch = raw.match(/(?:live:\s*)?(true|false)\b/i);
            var isLiveEnabled = boolMatch ? boolMatch[1].toLowerCase() === 'true' : false;
            var publishTimestamp = parseSummaryDate(raw);

            var status = 'Draft';
            if (boolMatch && isLiveEnabled) {
              status = Number.isFinite(publishTimestamp) && publishTimestamp > Date.now() ? 'Scheduled' : 'Published';
            } else if (boolMatch && !isLiveEnabled) {
              status = 'Draft';
            } else {
              var existingStatus = raw.match(/status:\s*(posted|scheduled|published|draft)/i);
              if (existingStatus) {
                var normalizedStatus = existingStatus[1].toLowerCase();
                status = normalizedStatus === 'posted' ? 'Published' : normalizedStatus.charAt(0).toUpperCase() + normalizedStatus.slice(1);
              }
            }

            var formatted = parsed.title + ' | ' + parsed.dateText + ' | Status: ' + status;
            if ((link.textContent || '').replace(/\s+/g, ' ').trim() === formatted) return;

            link.textContent = formatted;
            link.setAttribute('aria-label', formatted);
          });
        }

        function createOrUpdateQuickAction() {
          if (!isBlogCollectionRoute()) return;

          var btn = document.getElementById(QUICK_ACTION_ID);
          var newPostBtn = findNewBlogPostButton();
          if (!btn) {
            btn = document.createElement('a');
            btn.id = QUICK_ACTION_ID;
            btn.href = '/admin/video-to-blog.html';
            btn.textContent = 'Transcript to Blog';
            btn.style.textDecoration = 'none';
            btn.setAttribute('aria-label', 'Create AI blog from transcript');
          }

          if (newPostBtn && newPostBtn.parentElement) {
            btn.removeAttribute('style');
            btn.className = '';
            if (newPostBtn.className) {
              btn.className = newPostBtn.className;
            } else {
              btn.style.cssText = [
                'border:0',
                'background:#111827',
                'color:#fff',
                'border-radius:8px',
                'padding:10px 14px',
                'font-size:13px',
                'font-weight:700',
                'font-family:Arial,sans-serif',
                'cursor:pointer',
                'display:inline-flex',
                'align-items:center'
              ].join(';');
            }

            btn.style.marginLeft = '10px';
            btn.style.verticalAlign = 'middle';
            btn.style.position = 'static';
            btn.style.top = '';
            btn.style.right = '';
            btn.style.bottom = '';
            btn.style.left = '';
            btn.style.zIndex = '';
            btn.style.textDecoration = 'none';
            if (newPostBtn.nextSibling) {
              newPostBtn.parentElement.insertBefore(btn, newPostBtn.nextSibling);
            } else {
              newPostBtn.parentElement.appendChild(btn);
            }
          } else if (!btn.parentElement) {
            btn.style.cssText = [
              'position:fixed',
              'top:22px',
              'right:22px',
              'z-index:9998',
              'border:0',
              'background:#111827',
              'color:#fff',
              'border-radius:8px',
              'padding:10px 14px',
              'font-size:13px',
              'font-weight:700',
              'font-family:Arial,sans-serif',
              'cursor:pointer',
              'display:inline-flex',
              'align-items:center'
            ].join(';');
            document.body.appendChild(btn);
          }

          ensureBlogCollectionStyles();
          rewriteBlogEntryStatuses();
        }

        function removeQuickAction() {
          var btn = document.getElementById(QUICK_ACTION_ID);
          if (btn) btn.remove();

          var style = document.getElementById(COLLECTION_STYLE_ID);
          if (style) style.remove();
        }

        function setControlValue(name, value) {
          if (value == null) return false;
          var labelMap = {
            title: 'Title',
            slug: 'Slug',
            key_answer: 'Key Answer',
            excerpt: 'Excerpt',
            meta_description: 'Meta Description',
            body: 'Body',
            source_type: 'Source Type',
            source_url: 'Source URL'
          };

          function normalizeText(value) {
            return String(value || '')
              .replace(/[\u200B-\u200D\uFEFF]/g, '')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function findByLabelText(labelText) {
            if (!labelText) return null;
            var labels = Array.prototype.slice.call(document.querySelectorAll('label'));
            var target = labels.find(function (label) {
              var text = (label.textContent || '').toLowerCase().replace(/\s+/g, ' ').trim();
              return text.indexOf(labelText.toLowerCase()) !== -1;
            });
            if (!target) return null;

            if (target.htmlFor) {
              var byFor = document.getElementById(target.htmlFor);
              if (byFor) return byFor;
            }

            var parent = target.parentElement || target.closest('div');
            if (!parent) return null;
            return parent.querySelector('input, textarea, select, [contenteditable="true"], [role="textbox"]');
          }

          function findBodyFieldElement() {
            var strictSelectors = [
              '[name="body"]',
              'textarea[name="body"]',
              '[data-name="body"] textarea',
              '[data-name="body"] [contenteditable="true"]',
              '[data-name="body"] [role="textbox"]',
              '#body',
              'textarea[id*="body" i]'
            ];

            for (var i = 0; i < strictSelectors.length; i += 1) {
              var found = document.querySelector(strictSelectors[i]);
              if (found) return found;
            }

            return findByLabelText('Body');
          }

          function findFieldElement() {
            if (name === 'body') {
              return findBodyFieldElement();
            }

            var selectors = [
              '[name="' + name + '"]',
              '#'+ name,
              '[data-name="' + name + '"] input',
              '[data-name="' + name + '"] textarea',
              '[data-name="' + name + '"] select',
              '[id*="' + name + '"]',
              '[class*="' + name + '"] input',
              '[class*="' + name + '"] textarea'
            ];

            for (var i = 0; i < selectors.length; i += 1) {
              var found = document.querySelector(selectors[i]);
              if (found) return found;
            }

            var byLabel = findByLabelText(labelMap[name]);
            if (byLabel) return byLabel;

            return null;
          }

          function setInputValue(el, normalized) {
            var tagName = (el.tagName || '').toLowerCase();

            if (tagName === 'select') {
              el.value = normalized;
              el.dispatchEvent(new Event('change', { bubbles: true }));
              return true;
            }

            if (tagName === 'input' || tagName === 'textarea') {
              var prototype = tagName === 'textarea' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
              var valueSetter = Object.getOwnPropertyDescriptor(prototype, 'value');
              if (valueSetter && typeof valueSetter.set === 'function') {
                valueSetter.set.call(el, normalized);
              } else {
                el.value = normalized;
              }
              el.dispatchEvent(new Event('input', { bubbles: true }));
              el.dispatchEvent(new Event('change', { bubbles: true }));
              return true;
            }

            if (el.isContentEditable) {
              el.textContent = normalized;
              el.dispatchEvent(new Event('input', { bubbles: true }));
              return true;
            }

            return false;
          }

          var el = findFieldElement();
          if (!el) return false;

          var normalized = typeof value === 'string' ? value : String(value);
          var existing = el.value || el.textContent || '';
          if (normalized.trim() && normalizeText(existing) === normalizeText(normalized)) return true;

          el.focus();
          return setInputValue(el, normalized);
        }

        function hasBodyContent() {
          var bodyCandidates = Array.prototype.slice.call(document.querySelectorAll(
            '[name="body"], textarea[name="body"], [data-name="body"] textarea, [data-name="body"] [contenteditable="true"], [data-name="body"] [role="textbox"], #body, textarea[id*="body" i]'
          ));

          var labelMatches = Array.prototype.slice.call(document.querySelectorAll('label')).map(function (label) {
            var text = (label.textContent || '').toLowerCase().replace(/\s+/g, ' ').trim();
            if (text.indexOf('body') === -1) return null;
            if (label.htmlFor) {
              return document.getElementById(label.htmlFor);
            }
            var parent = label.parentElement || label.closest('div');
            return parent ? parent.querySelector('textarea, [contenteditable="true"], [role="textbox"]') : null;
          }).filter(Boolean);

          labelMatches.forEach(function (el) {
            if (bodyCandidates.indexOf(el) === -1) {
              bodyCandidates.push(el);
            }
          });

          for (var i = 0; i < bodyCandidates.length; i += 1) {
            var el = bodyCandidates[i];
            var raw = (el.value || el.textContent || '').replace(/[\u200B-\u200D\uFEFF]/g, '');
            if (raw.replace(/\s+/g, '').length > 0) {
              return true;
            }
          }

          return false;
        }

        (function setupBodySaveGuard() {
          var lastWarnAt = 0;

          function isSaveActionTarget(target) {
            if (!target || !(target instanceof Element)) return false;
            var actionEl = target.closest('button, [role="button"], a');
            if (!actionEl) return false;

            var label = [
              actionEl.textContent || '',
              actionEl.getAttribute('aria-label') || '',
              actionEl.getAttribute('title') || ''
            ].join(' ').toLowerCase();

            return label.indexOf('save') !== -1
              || label.indexOf('publish') !== -1
              || label.indexOf('update') !== -1;
          }

          document.addEventListener('click', function (event) {
            if (!isBlogEditorRoute()) return;
            if (!isSaveActionTarget(event.target)) return;
            if (hasBodyContent()) return;

            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }

            var now = Date.now();
            if (now - lastWarnAt > 1200) {
              lastWarnAt = now;
              createOrUpdatePanel('Cannot save yet: Body is empty. Paste/apply blog content first, then save.', true);
              window.alert('Body is empty. Please add blog content before saving or publishing.');
            }
          }, true);
        })();

        function createOrUpdatePanel(message, isError) {
          if (!isBlogNewRoute()) return;

          var panel = document.getElementById(PANEL_ID);
          if (!panel) {
            panel = document.createElement('div');
            panel.id = PANEL_ID;
            panel.style.cssText = [
              'position:fixed',
              'top:12px',
              'right:12px',
              'z-index:9999',
              'background:#ffffff',
              'border:1px solid #d1d5db',
              'border-radius:8px',
              'padding:10px',
              'box-shadow:0 8px 18px rgba(0,0,0,0.12)',
              'font-family:Arial,sans-serif',
              'min-width:240px'
            ].join(';');
            document.body.appendChild(panel);
          }

          panel.innerHTML = '';

          var title = document.createElement('div');
          title.textContent = 'AI Draft Helper';
          title.style.cssText = 'font-weight:700;margin-bottom:6px;color:#111827;';
          panel.appendChild(title);

          var bodyText = document.createElement('div');
          bodyText.textContent = message || 'AI draft is ready to apply.';
          bodyText.style.cssText = 'font-size:12px;margin-bottom:8px;color:' + (isError ? '#b91c1c' : '#374151') + ';';
          panel.appendChild(bodyText);

          var applyBtn = document.createElement('button');
          applyBtn.textContent = 'Apply AI Draft';
          applyBtn.style.cssText = 'border:0;background:#111827;color:#fff;border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer;margin-right:6px;';
          applyBtn.onclick = function () {
            var result = applyPrefillOnce(true);
            var bodyReady = hasBodyContent();
            createOrUpdatePanel(
              result.appliedCount > 0
                ? (bodyReady
                    ? 'Applied ' + result.appliedCount + ' fields. Body detected. Review, then save.'
                    : 'Applied some fields, but Body is still empty. Wait for load and click Apply again before saving.')
                : 'No fields matched yet. Wait for form load, then click again.',
              result.appliedCount === 0 || !bodyReady
            );
          };
          panel.appendChild(applyBtn);

          var clearBtn = document.createElement('button');
          clearBtn.textContent = 'Clear Pending';
          clearBtn.style.cssText = 'border:1px solid #d1d5db;background:#fff;color:#111827;border-radius:6px;padding:6px 8px;font-size:12px;cursor:pointer;';
          clearBtn.onclick = function () {
            localStorage.removeItem(PREFILL_PENDING_KEY);
            createOrUpdatePanel('Pending AI draft cleared.', false);
          };
          panel.appendChild(clearBtn);
        }

        function removePanel() {
          var panel = document.getElementById(PANEL_ID);
          if (panel) panel.remove();
        }

        function applyPrefillOnce(allowPartial) {
          if (!isBlogNewRoute()) {
            return { appliedCount: 0, titleApplied: false, bodyApplied: false };
          }

          if (localStorage.getItem(PREFILL_PENDING_KEY) !== '1') {
            return { appliedCount: 0, titleApplied: false, bodyApplied: false };
          }

          var data = readPrefill();
          if (!data) {
            localStorage.removeItem(PREFILL_PENDING_KEY);
            return { appliedCount: 0, titleApplied: false, bodyApplied: false };
          }

          var mapped = {
            title: data.title || '',
            slug: data.slug || '',
            key_answer: data.key_answer || '',
            excerpt: data.excerpt || '',
            meta_description: data.meta_description || '',
            body: data.body || '',
            source_type: data.source_type || 'instagram',
            source_url: data.source_url || ''
          };

          var appliedCount = 0;
          var titleApplied = false;
          var bodyApplied = false;
          Object.keys(mapped).forEach(function (key) {
            var wasApplied = setControlValue(key, mapped[key]);
            if (wasApplied) {
              appliedCount += 1;
              if (key === 'title' && mapped[key]) titleApplied = true;
              if (key === 'body' && mapped[key]) bodyApplied = true;
            }
          });

          var success = titleApplied && bodyApplied && appliedCount >= 4 && hasBodyContent();
          if (success) {
            localStorage.removeItem(PREFILL_PENDING_KEY);
          }

          return {
            appliedCount: appliedCount,
            titleApplied: titleApplied,
            bodyApplied: bodyApplied,
          };
        }

        var attempts = 0;
        setInterval(function () {
          attempts += 1;

          if (isBlogCollectionRoute()) {
            createOrUpdateQuickAction();
          } else {
            removeQuickAction();
          }

          if (isBlogNewRoute()) {
            if (localStorage.getItem(PREFILL_PENDING_KEY) === '1') {
              var result = applyPrefillOnce(false);
              if (result.appliedCount > 0) {
                if (hasBodyContent()) {
                  createOrUpdatePanel('AI draft applied. Body detected. Review, then save/publish.', false);
                } else {
                  createOrUpdatePanel('AI draft detected, but Body is still empty. Do not save yet. Click Apply AI Draft again after form fully loads.', true);
                }
              } else {
                createOrUpdatePanel('AI draft detected. Click Apply AI Draft if fields are still empty.', false);
              }
            } else {
              removePanel();
            }
          } else {
            removePanel();
          }

          if (attempts > 240) {
            attempts = 0;
          }
        }, 600);

        window.addEventListener('hashchange', function () {
          if (isBlogNewRoute() && localStorage.getItem(PREFILL_PENDING_KEY) === '1') {
            createOrUpdatePanel('AI draft detected. Applying now...', false);
            applyPrefillOnce(false);
            removeQuickAction();
          } else if (isBlogCollectionRoute()) {
            createOrUpdateQuickAction();
            removePanel();
          } else {
            removePanel();
            removeQuickAction();
          }
        });

        // After save/publish: redirect to collection list
        (function setupPostSaveRedirect() {
          var wasOnNew = false;

          function checkRoute() {
            var hash = window.location.hash || '';
            var onNew = hash.indexOf('/collections/blog/new') !== -1;
            var onEntry = hash.indexOf('/collections/blog/entries/') !== -1;

            if (onNew) {
              wasOnNew = true;
            } else if (wasOnNew && onEntry) {
              wasOnNew = false;
              setTimeout(function () {
                window.location.hash = '/collections/blog';
              }, 1200);
            } else if (!onNew && !onEntry) {
              wasOnNew = false;
            }
          }

          window.addEventListener('hashchange', checkRoute);
          checkRoute();
        })();
      })();

      (function loadDecapCMS() {
        var loadingEl = document.getElementById('cms-loading');

        function showError() {
          if (loadingEl) {
            loadingEl.innerHTML = 'CMS failed to load. Please refresh the page. If this continues, check Netlify CSP settings for /admin.';
          }
        }

        function attachScript(src, onLoad, onError) {
          var script = document.createElement('script');
          script.src = src;
          script.async = true;
          script.onload = onLoad;
          script.onerror = onError;
          document.body.appendChild(script);
        }

        attachScript(
          'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js',
          function () {
            if (loadingEl) loadingEl.remove();
          },
          function () {
            attachScript(
              'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js',
              function () {
                if (loadingEl) loadingEl.remove();
              },
              showError
            );
          }
        );
      })();
    </script>
  </body>
</html>
