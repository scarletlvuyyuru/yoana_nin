[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# Ensure Decap CMS admin files are served directly (not rewritten to index.html)
[[redirects]]
  from = "/admin/config.yml"
  to = "/admin/config.yml"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200


# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Function-specific settings
[functions.instagram-feed]
  timeout = 10

[functions.instagram-webhook]
  timeout = 10

[functions.transcript-test]
  timeout = 15

[functions.video-to-blog]
  timeout = 25

[functions.assessment-results]
  timeout = 15

[functions.publish-blog-post]
  timeout = 20

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' blob: https://api.netlify.com https://identity.netlify.com https://app.netlify.com https://git-gateway.netlify.com https://*.netlify.com https://unpkg.com https://cdn.jsdelivr.net; frame-src 'self' https://identity.netlify.com https://app.netlify.com;"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-CMS-CSP-Version = "v2-admin-connect-relaxed"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https: blob: data:; frame-src 'self' https://identity.netlify.com https://app.netlify.com;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables for development
[context.development]
  command = "npm run dev"

# Branch-specific settings  
[context.production]
  command = "npm run build"

[context.production.environment]
  ENABLE_PRERENDER = "true"

[context.branch-deploy]
  command = "npm run build"
  ignore = "echo $HEAD | grep -q 'dependabot'"

[context.branch-deploy.environment]
  ENABLE_PRERENDER = "true"

[context.deploy-preview.environment]
  ENABLE_PRERENDER = "true"